version: "3.9"

services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    container_name: zestogram-api
    environment:
      - TELEGRAM_API_ID=${TELEGRAM_API_ID}
      - TELEGRAM_API_HASH=${TELEGRAM_API_HASH}
    volumes:
      - bot-api-data:/var/lib/telegram-bot-api
    restart: unless-stopped
    # Exposing only internally to other services in this docker-compose
    expose:
      - 8081

  bot:
    build: .
    container_name: zestogram-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/data
    depends_on:
      - telegram-bot-api
    healthcheck:
      test: ["CMD", "python", "-c", "import os; exit(0 if os.path.exists('/data') else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
    ports:
      - "${WEBHOOK_PORT:-8443}:${WEBHOOK_PORT:-8443}"

  redis:
    image: redis:7-alpine
    container_name: zestogram-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data

volumes:
  bot-api-data:
  redis-data:
